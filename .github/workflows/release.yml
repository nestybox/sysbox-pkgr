#
# Sysbox release.
#
# Builds the sysbox-ce deb packages and the sysbox-deploy-k8s image (amd64 and
# arm64), and, if "publish" is selected, publishes them:
#
# 1. validate    Checks that VERSION / CHANGELOG.md in nestybox/sysbox are
#                release-ready and, when publishing, that the signed v<VERSION>
#                tag exists at the commit to release.
# 2. build       Builds the debs and the per-arch k8s images (see build.yml)
#                from the validated commit. When publishing, the images are
#                pushed to ghcr.io with an arch suffix (e.g., v0.7.2-0_amd64).
# 3. release     (publish only) Creates the GitHub release for the existing
#                v<VERSION> tag in nestybox/sysbox, with the debs and checksums
#                attached.
# 4. k8s-publish (publish only) Combines the per-arch images into the multi-arch
#                tags (v<VERSION>-<patch> and latest) and opens a PR updating
#                the sysbox K8s manifests.
#
# Without "publish" (the default), only steps 1-2 run and nothing is pushed or
# created: the debs are kept as workflow artifacts. Do a dry run first.
#
# Release procedure:
#
# 1. Run "release-prep" and merge the PR it opens in nestybox/sysbox.
# 2. A maintainer creates and pushes the signed, annotated release tag on the
#    merge commit (tags are not created by CI so that they stay signed by a
#    maintainer):
#      git tag -s vX.Y.Z -m "Release vX.Y.Z" <merge-commit>
#      git push origin vX.Y.Z
# 3. Run this workflow with ref=vX.Y.Z, first without "publish" (dry run, which
#    can use any ref and doesn't need the tag), then with it.
#
# The release can only be cut once per version. If a step after "release"
# fails, re-run only the failed jobs rather than re-dispatching the workflow.
#
# Required repository secret (only when publishing):
#
# * SYSBOX_RELEASE_TOKEN: fine-grained PAT for nestybox/sysbox with
#   "Contents" and "Pull requests" read/write (create the release, open PRs).
#
# Image pushes use the workflow's GITHUB_TOKEN, so the sysbox-deploy-k8s
# package must grant this repo write access (package settings -> "Manage
# Actions access").
#
# Optional repository variables, used to rehearse the process against scratch
# targets instead of the real ones:
#
# * SYSBOX_REPO (default nestybox/sysbox)
# * K8S_IMAGE   (default ghcr.io/nestybox/sysbox-deploy-k8s)
#
# Optional: create a "release" environment with a required reviewer (the
# other maintainer) to gate the publishing jobs.
#

name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref of the sysbox repo to release (the vX.Y.Z tag when publishing)"
        required: false
        default: master
        type: string
      publish:
        description: "Publish the release (unchecked = dry run)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sysbox-release
  cancel-in-progress: false

env:
  SYSBOX_REPO: ${{ vars.SYSBOX_REPO || 'nestybox/sysbox' }}
  K8S_IMAGE: ${{ vars.K8S_IMAGE || 'ghcr.io/nestybox/sysbox-deploy-k8s' }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: checkout sysbox-pkgr
        uses: actions/checkout@v4

      - name: checkout sysbox
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SYSBOX_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SYSBOX_RELEASE_TOKEN || github.token }}
          path: sources/sysbox
          fetch-depth: 0

      - name: check release readiness
        if: inputs.publish
        run: release/check-release-ready.sh sources/sysbox

      # Dry runs are allowed for versions that were already released.
      - name: check release readiness (dry run)
        if: ${{ !inputs.publish }}
        run: release/check-release-ready.sh sources/sysbox --skip-tag-check

      # The commit is pinned here so that all jobs build the same sources even
      # if the ref moves while the workflow runs.
      - name: collect release metadata
        id: meta
        run: |
          echo "version=$(tr -d '[:space:]' < sources/sysbox/VERSION)" \
              >> "${GITHUB_OUTPUT}"
          echo "sha=$(git -C sources/sysbox rev-parse HEAD)" \
              >> "${GITHUB_OUTPUT}"
          echo "image_tag=$(make -C k8s --no-print-directory -s print-image-tag)" \
              >> "${GITHUB_OUTPUT}"

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      sysbox_repo: ${{ vars.SYSBOX_REPO || 'nestybox/sysbox' }}
      k8s_image: ${{ vars.K8S_IMAGE || 'ghcr.io/nestybox/sysbox-deploy-k8s' }}
      ref: ${{ needs.validate.outputs.sha }}
      build_k8s: true
      push_images: ${{ inputs.publish }}
    secrets: inherit

  release:
    if: inputs.publish
    needs: [validate, build]
    runs-on: ubuntu-22.04
    environment: release
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ secrets.SYSBOX_RELEASE_TOKEN }}
    steps:
      - name: checkout sysbox-pkgr
        uses: actions/checkout@v4

      - name: checkout sysbox
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SYSBOX_REPO }}
          ref: ${{ needs.validate.outputs.sha }}
          token: ${{ secrets.SYSBOX_RELEASE_TOKEN }}
          path: sysbox

      - name: download deb packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: debs

      - name: generate release notes
        run: release/release-notes.sh sysbox debs "${RUNNER_TEMP}/notes.md"

      # The maintainer-signed v<VERSION> tag must already exist in the repo.
      - name: create github release
        run: |
          gh release create "v${VERSION}" debs/*.deb \
              --repo "${SYSBOX_REPO}" \
              --verify-tag \
              --title "Release v${VERSION}" \
              --notes-file "${RUNNER_TEMP}/notes.md"

      # Download what was just uploaded and compare it with what was built.
      - name: verify the uploaded assets
        run: |
          mkdir uploaded
          gh release download "v${VERSION}" --repo "${SYSBOX_REPO}" \
              --dir uploaded --pattern "*.deb"
          for deb in debs/*.deb; do
              cmp "${deb}" "uploaded/$(basename "${deb}")"
          done
          echo "uploaded assets match the built packages"

  k8s-publish:
    if: inputs.publish
    needs: [validate, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
      GH_TOKEN: ${{ secrets.SYSBOX_RELEASE_TOKEN }}
    steps:
      - name: checkout sysbox-pkgr
        uses: actions/checkout@v4

      - name: login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Notice that registry.nestybox.com mirrors ghcr.io, so no separate
      # publishing step is needed for it.
      - name: publish multi-arch image
        run: |
          for tag in "${IMAGE_TAG}" latest; do
              docker buildx imagetools create \
                  -t "${K8S_IMAGE}:${tag}" \
                  "${K8S_IMAGE}:${IMAGE_TAG}_amd64" \
                  "${K8S_IMAGE}:${IMAGE_TAG}_arm64"
              docker buildx imagetools inspect "${K8S_IMAGE}:${tag}"
          done

      - name: checkout sysbox
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SYSBOX_REPO }}
          ref: master
          token: ${{ secrets.SYSBOX_RELEASE_TOKEN }}
          path: sysbox

      - name: open k8s manifests PR
        run: |
          release/bump-k8s-manifests.sh sysbox "${IMAGE_TAG}"
          cd sysbox
          if git diff --quiet; then
              echo "K8s manifests already point at ${IMAGE_TAG}."
              exit 0
          fi
          branch="k8s-manifests-v${VERSION}"
          git switch -c "${branch}"
          git add sysbox-k8s-manifests/sysbox-install.yaml \
                  sysbox-k8s-manifests/sysbox-uninstall.yaml
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -s -m "Update sysbox k8s manifest to use release v${VERSION}."
          git push origin "${branch}"
          gh pr create \
              --repo "${SYSBOX_REPO}" \
              --base master \
              --head "${branch}" \
              --title "Update sysbox k8s manifest to use release v${VERSION}." \
              --body "Points the Sysbox K8s install/uninstall manifests at sysbox-deploy-k8s:${IMAGE_TAG}."
